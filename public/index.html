<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DUO Konvooi-quiz</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rammetto+One&family=Figtree:wght@400;600;800&display=swap">
<style>
/* Layout: één smalle kolom voor in de auto; grote knoppen, grote letters. Marine + crème + mosterdgeel + 2CV-rood. */
:root{--bg:#F7EFDF;--card:#FFF9EF;--fg:#14213D;--mut:#4A5570;--acc:#F4B731;--red:#B42D23;--line:#14213D;--ok:#2E7D4F;--navy:#14213D;--onnavy:#F7EFDF;
 --display:'Rammetto One',Georgia,serif;--body:'Figtree',Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1730;--card:#17244A;--fg:#F7EFDF;--mut:#B7C2DA;--line:#F7EFDF;--red:#FF7B6B;--ok:#6FD39A;--navy:#F4B731;--onnavy:#14213D;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1730;--card:#17244A;--fg:#F7EFDF;--mut:#B7C2DA;--line:#F7EFDF;--red:#FF7B6B;--ok:#6FD39A;--navy:#F4B731;--onnavy:#14213D;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:18px/1.45 var(--body);margin:0;padding-block:20px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:560px;margin:16px auto 0;display:flex;flex-direction:column;gap:16px;min-width:0}
h1{font:400 34px/1.1 var(--display);margin:0;text-wrap:balance}
h2{font:800 14px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin:0}
.q{font:800 26px/1.25 var(--body);text-wrap:balance;margin:0}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
button{font:800 18px var(--body);border:2px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;padding:14px 16px;cursor:pointer;min-height:52px}
button.pri{background:var(--navy);color:var(--onnavy)}
button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
button.no{background:var(--red);color:#fff;border-color:var(--red)}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button[disabled]{opacity:.45;cursor:default}
input[type=text]{font:600 22px var(--body);width:100%;padding:14px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 120px}
.teams{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.score{display:flex;flex-direction:column;gap:6px}
.score div{display:flex;justify-content:space-between;font-weight:800;font-variant-numeric:tabular-nums;padding:8px 12px;border-radius:10px;border:2px solid var(--line);background:var(--card)}
.score div.me{background:var(--acc);color:#14213D;border-color:var(--acc)}
.mut{color:var(--mut);font-size:15px;margin:0}
.ans{background:var(--navy);color:var(--onnavy);border-radius:12px;padding:14px;font-weight:800;font-size:22px}
.sub{display:flex;gap:10px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:10px;flex-wrap:wrap}
.sub span{min-width:0;overflow-wrap:anywhere}
.sub .b{display:flex;gap:8px}.sub button{min-height:44px;padding:8px 14px}
.pill{display:inline-block;font:800 13px var(--body);letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:99px;background:var(--acc);color:#14213D;align-self:flex-start}
.link{background:none;border:none;color:var(--mut);text-decoration:underline;font-size:15px;min-height:0;padding:4px;font-weight:600}

.hero{background:#14213D;color:#F7EFDF;border-radius:0 0 22px 22px;margin:-20px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-left,0px)) 0;position:relative;overflow:hidden}
.hero .in{max-width:560px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.hero .t{padding-bottom:18px;min-width:0}
.hero .k{font:800 12px var(--body);letter-spacing:.16em;text-transform:uppercase;color:#F4B731;margin:0 0 6px}
.hero .h{font:400 40px/1 var(--display);color:#F4B731;text-shadow:3px 3px 0 #D7372B;margin:0}
.hero .s{font:600 14px var(--body);color:#D3DBEA;margin:8px 0 0}
.hero img{width:46%;max-width:230px;height:auto;margin-bottom:6px;flex:none}
.check{height:14px;background:repeating-conic-gradient(#F7EFDF 0 25%,#14213D 0 50%) 0 0/14px 14px;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)))}
</style></head><body>

<script>
let Q=[];
const app=document.getElementById('app');
let recvAt=Date.now(),customAns='',lastKey='',pin='',pinErr='',team=null,state={q:-1,rev:false,ans:''},subs={},marks={},answers={},mode=null;
const $=(h)=>{const keep={};['a','xq','xa'].forEach(i=>{const e=document.getElementById(i);if(e)keep[i]=e.value});const af=document.activeElement&&document.activeElement.id;
 app.innerHTML=h;for(const i in keep){const e=document.getElementById(i);if(e&&keep[i]&&(e.value===''||i!='a'))e.value=keep[i]}
 if(af){const e=document.getElementById(af);if(e&&e.focus){e.focus()}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function totals(){const t={1:0,2:0,3:0},best={};
 for(const k in marks){if(marks[k]&&marks[k].ok){const [q,n]=k.split('_t');if(t[n]===undefined)continue;t[n]++;const ms=subs[k]&&subs[k].ms;if(typeof ms=='number'&&(!best[q]||ms<best[q].ms))best[q]={n,ms}}}
 for(const q in best)t[best[q].n]++;return t}
function fastest(id){let b=null;for(const n of [1,2,3]){const k=id+'_t'+n;if(marks[k]&&marks[k].ok&&subs[k]&&typeof subs[k].ms=='number'&&(!b||subs[k].ms<b.ms))b={n,ms:subs[k].ms}}return b}
const sec=ms=>(ms/1000).toFixed(1).replace('.',',')+' s';
function scoreHtml(){const t=totals();return '<div class="score">'+[1,2,3].map(n=>`<div class="${team==n?'me':''}"><span>Team ${n}</span><span>${t[n]}</span></div>`).join('')+'</div>'}
async function api(path,body){const r=await fetch(path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});return r.ok?r.json():Promise.reject(r.status)}
async function setS(p){await api('/api/host/state',{pin,patch:p})}
function flash(){const f=document.createElement('div');f.textContent='Nieuwe vraag!';f.style.cssText='position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);background:#F4B731;color:#14213D;font:800 20px var(--body);text-align:center;padding:12px;z-index:20';document.body.appendChild(f);setTimeout(()=>f.remove(),2500)}
function render(){
 if(!Q.length){return $('<div class="card"><p>Verbinden met de quiz… Geen bereik? Het herstelt vanzelf.</p></div>')}
 if(mode=='pin')return $(`<div class="card"><h2>Quizmaster</h2><input type="password" id="pin" placeholder="Pincode" autocomplete="off" enterkeyhint="go">${pinErr?'<p class="mut" style="color:var(--red)">'+pinErr+'</p>':''}<button class="pri" data-pin="1">Inloggen</button><button class="link" data-back="1">Terug</button></div>`);
 if(!mode){
  return $(`<p class="mut">Kies je team. Elke wagen speelt als één team.</p>
  <div class="card"><h2>Welk team ben je?</h2><div class="teams">${[1,2,3].map(n=>`<button class="pri" data-t="${n}">Team ${n}</button>`).join('')}</div>
  <button data-h="1">Ik ben de quizmaster</button></div>`);
 }
 const cur=state.custom?{r:'Extra vraag',q:state.custom.q}:Q[state.q];
 const head=`<div class="row" style="justify-content:space-between;align-items:center;flex-wrap:nowrap"><span class="pill">${mode=='host'?'Quizmaster':'Team '+team}</span><button class="link" data-back="1">Wissel</button></div>`;
 if(!cur){
  if(mode=='host')return $(`${head}<h1>Klaar om te starten?</h1><div class="card"><button class="pri" data-go="0">Start met vraag 1</button><p class="mut">Spelers zien de vraag zodra je die opent.</p></div>${scoreHtml()}`);
  return $(`${head}<h1>Wacht op de quizmaster</h1><p class="mut">De eerste vraag komt zo.</p>${scoreHtml()}`);
 }
 if(state.pause&&mode!='host')return $(`${head}<div class="card" style="text-align:center"><h2>Pauze</h2><p class="q">${esc(state.pause)}</p><p class="mut">De volgende etappe start straks. Hou de gsm bij de hand.</p></div>${scoreHtml()}`);
 const n=state.q, id=state.custom?state.custom.id:'q'+String(n).padStart(2,'0');
 const body=`<h2>${state.custom?'Extra vraag':'Vraag '+(n+1)+' van '+Q.length} · ${state.custom?'van de quizmaster':esc(cur.r)}</h2><p class="q">${esc(cur.q)}</p>`;
 if(mode=='host'){
  const fb=fastest(id);const rows=[1,2,3].map(t=>{const s=subs[id+'_t'+t];const m=marks[id+'_t'+t];
   return `<div class="sub"><span><b>Team ${t}:</b> ${s?esc(s.text):'<i class="mut">nog niets</i>'}${s&&typeof s.ms=='number'?` <span class="mut">· ${sec(s.ms)}${fb&&fb.n==t?' ⚡ snelste, +1 bonus':''}</span>`:''}</span><span class="b"><button class="${m&&m.ok?'ok':''}" data-m="${t}" data-v="1" ${s?'':'disabled'} aria-label="Goed">✓</button><button class="${m&&m.ok===false?'no':''}" data-m="${t}" data-v="0" ${s?'':'disabled'} aria-label="Fout">✗</button></span></div>`}).join('');
  return $(`${head}<div class="card">${body}<div class="ans">${esc(state.custom?customAns:(answers[id]||'…'))}</div><div>${rows}</div></div>
  <div class="card"><h2>Extra vraag live sturen</h2><input type="text" id="xq" placeholder="Typ een vraag en druk op Enter" enterkeyhint="send"><input type="text" id="xa" placeholder="Goed antwoord (optioneel, enkel voor jou)" enterkeyhint="send"><button class="pri" data-x="1">Stuur naar alle teams</button></div>
  <div class="card"><h2>Etappe-stops</h2><div class="row"><button data-p="Korte stop: even de benen strekken en een foto maken.">Korte stop</button><button data-p="Lunchstop: smakelijk! Na de lunch volgt etappe 3.">Lunch</button><button class="pri" data-p="" ${state.pause?'':'disabled'}>Verder met de quiz</button></div>${state.pause?'<p class="mut">Pauze actief: '+esc(state.pause)+'</p>':''}</div>
  <div class="row"><button data-go="${n-1}" ${(n==0||state.custom)?'disabled':''}>Vorige</button><button class="pri" data-rev="1" ${state.rev?'disabled':''}>Toon antwoord aan iedereen</button><button class="pri" data-go="${state.custom?n:n+1}" ${(!state.custom&&n+1>=Q.length)?'disabled':''}>Volgende</button></div>${scoreHtml()}<button class="link" data-reset="1">Quiz opnieuw beginnen</button>`);
 }
 const mine=subs[id+'_t'+team], mk=marks[id+'_t'+team];
 let ansBlock='';
 if(state.rev){ansBlock=`<div class="ans">${esc(state.ans)}</div><p class="mut">${mk?(mk.ok?'Juist, +1 punt voor jullie team.'+(fastest(id)&&fastest(id).n==team?' Jullie waren de snelste: +1 bonus!':'')+'':'Helaas, dit was fout.'):'De quizmaster kijkt het na.'}</p>`}
 else ansBlock=`<input type="text" id="a" placeholder="Jullie antwoord" enterkeyhint="send" value="${mine?esc(mine.text):''}" autocomplete="off"><button class="pri" data-send="1">${mine?'Antwoord aanpassen':'Verstuur'}</button>${mine?'<p class="mut">Verstuurd: '+esc(mine.text)+'</p>':''}`;
 return $(`${head}<div class="card">${body}${ansBlock}</div>${scoreHtml()}`);
}
app.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const id=e.target.id;const sel=id=='pin'?'[data-pin]':id=='a'?'[data-send]':(id=='xq'||id=='xa')?'[data-x]':null;if(sel){e.preventDefault();const b=app.querySelector(sel);if(b)b.click()}});
app.addEventListener('click',async e=>{
 const b=e.target.closest('button');if(!b)return;
 try{
 if(b.dataset.t){team=+b.dataset.t;mode='team';ls('duoTeam',team);}
 else if(b.dataset.h){if(pin){try{await api('/api/host/check',{pin});mode='host';await loadAnswers()}catch(e){mode='pin'}}else mode='pin'}
 else if(b.dataset.pin){pin=document.getElementById('pin').value.trim();try{await api('/api/host/check',{pin});ls('duoPin',pin);pinErr='';mode='host';await loadAnswers()}catch(e){pinErr='Onjuiste pincode.';pin=''}}
 else if(b.dataset.back){mode=null}
 else if(b.dataset.go!==undefined){customAns='';await setS({q:+b.dataset.go,custom:null,pause:null,rev:false,ans:''});return}
 else if(b.dataset.p!==undefined){await setS({pause:b.dataset.p||null});return}
 else if(b.dataset.rev){const id='q'+String(state.q).padStart(2,'0');await setS({rev:true,ans:state.custom?customAns:(answers[id]||'')});return}
 else if(b.dataset.x){const q=document.getElementById('xq').value.trim();if(!q)return;customAns=document.getElementById('xa').value.trim();await setS({custom:{id:'x'+Date.now(),q},rev:false,ans:''});return}
 else if(b.dataset.m){const id='q'+String(state.q).padStart(2,'0')+'_t'+b.dataset.m;await api('/api/host/mark',{pin,key:id,ok:b.dataset.v=='1'});return}
 else if(b.dataset.send){const mine=subs[(state.custom?state.custom.id:'q'+String(state.q).padStart(2,'0'))+'_t'+team];const v=document.getElementById('a').value.trim();if(!v)return;await api('/api/sub',{key:(state.custom?state.custom.id:'q'+String(state.q).padStart(2,'0'))+'_t'+team,text:v,ms:(mine&&typeof mine.ms=='number')?mine.ms:Date.now()-recvAt});return}
 else if(b.dataset.reset){if(b.dataset.sure){customAns='';await api('/api/host/reset',{pin});return}b.dataset.sure=1;b.textContent='Zeker? Tik nog eens';return}
 }catch(err){console.log(err)}
 render();
});
async function loadAnswers(){try{answers=await api('/api/host/answers',{pin})}catch(e){}}
function onData(d){state=d.state||{q:-1,rev:false,ans:''};subs=d.subs||{};marks=d.marks||{};
 const k=state.q+'|'+(state.custom?state.custom.id:'');
 if(lastKey&&k!==lastKey&&state.q>=0&&mode=='team'){try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}flash()}
 if(k!==lastKey)recvAt=Date.now();lastKey=k;render()}
(async()=>{
 render();
 const t=+ls('duoTeam');if(t>=1&&t<=3){team=t;mode='team'}
 try{pin=ls('duoPin')||''}catch(e){}
 async function loadQ(){try{Q=await (await fetch('/api/questions')).json();render()}catch(e){setTimeout(loadQ,3000)}}
 loadQ();
 const es=new EventSource('/events');es.onmessage=e=>onData(JSON.parse(e.data));
})();
</script></body></html>
